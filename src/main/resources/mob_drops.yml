# ============================================================
#  VortexEnchantments — Mob Drop Configuration
# ============================================================
# Controls enchanted book drops from mobs.
# drop-chance: probability (0.0 - 1.0) that a mob drops a book when killed by a player.
# rarity-weights: weighted chance per rarity tier (higher = more common).

enabled: true

# Global multiplier applied to all drop chances
global-drop-multiplier: 1.0

mobs:
  # --- Common Mobs (low chance, mostly Common/Uncommon) ---
  ZOMBIE:
    drop-chance: 0.02
    rarity-weights:
      COMMON: 60
      UNCOMMON: 30
      RARE: 8
      EPIC: 2

  SKELETON:
