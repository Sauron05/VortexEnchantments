name: VortexEnchantments
version: '${project.version}'
main: com.vortexrpg.enchantments.VortexEnchantments
description: '939 custom enchantments with success rates, dust, scrolls, tinkerer, alchemist, souls economy, armor sets & more'
authors: [ 'EternalRealm™' ]
website: https://eternalrealm.uk
# api-version '1.21' is the highest value accepted by BOTH targets (1.21.11 and 26.1.2);
# a server refuses to load a plugin whose api-version is newer than the server, so this
# single value keeps one jar loadable across the whole 1.21.11 -> 26.1.2 range.
api-version: '1.21'
folia-supported: true

softdepend:
  - ProtocolLib
  - PlaceholderAPI
  - Vault

commands:
  ve:
    description: VortexEnchantments main command
    usage: /ve <give|list|info|reload|search|aura|scroll|extractor|forge|admin|browse|tinkerer|alchemist|souls|dust|whitescroll|blackscroll|shop|slotincreaser|transmog|randomscroll|holyscroll|combos|evolve|particles> [args...]
    aliases: [ vortex, vortexenchant ]
    permission: vortex.use

permissions:
  vortex.use:
    description: Access to /ve command
    default: true
  vortex.admin:
    description: Full admin access to VortexEnchantments
    default: op
    children:
      vortex.use: true
      vortex.reload: true
      vortex.give: true
      vortexenchantments.admin: true
      vortexenchantments.scroll: true
      vortexenchantments.extractor: true
      vortexenchantments.forge: true
      vortexenchantments.dust: true
      vortexenchantments.whitescroll: true
      vortexenchantments.blackscroll: true
      vortexenchantments.shop: true
      vortexenchantments.slotincreaser: true
      vortexenchantments.transmog: true
      vortexenchantments.randomscroll: true
      vortexenchantments.holyscroll: true
  vortex.reload:
    description: Permission to reload VortexEnchantments
    default: op
  vortex.give:
    description: Permission to give enchanted books
    default: op
  vortexenchantments.admin:
    description: Access to the admin management GUI
    default: op
  vortexenchantments.scroll:
    description: Permission to give Mystery Scrolls
    default: op
  vortexenchantments.extractor:
    description: Permission to give Extractor Scrolls
    default: op
  vortexenchantments.forge:
    description: Access to the Enchant Forge
    default: true
  vortexenchantments.aura:
    description: Toggle particle aura effect
    default: true
  vortexenchantments.browse:
    description: Open the enchantment browser GUI
    default: true
  vortexenchantments.tinkerer:
    description: Access to the Tinkerer
    default: true
  vortexenchantments.alchemist:
    description: Access to the Alchemist
    default: true
  vortexenchantments.souls:
    description: Access to the Souls shop
    default: true
  vortexenchantments.dust:
    description: Permission to give Enchant Dust
    default: op
  vortexenchantments.whitescroll:
    description: Permission to give White Scrolls
    default: op
  vortexenchantments.blackscroll:
    description: Permission to give Black Scrolls
    default: op
  vortexenchantments.shop:
    description: Access to the enchant shop
    default: true
  vortexenchantments.combos:
    description: View enchant combos
    default: true
  vortexenchantments.evolve:
    description: Evolve enchantments
    default: true
  vortexenchantments.particles:
    description: Toggle enchant particle effects
    default: true
  vortexenchantments.slotincreaser:
    description: Permission to give Slot Increaser scrolls
    default: op
  vortexenchantments.transmog:
    description: Permission to give Transmog Scrolls
    default: op
  vortexenchantments.randomscroll:
    description: Permission to give Randomization Scrolls
    default: op
  vortexenchantments.holyscroll:
    description: Permission to give Holy White Scrolls
    default: op
